[package]
name = "gateway"
version = "0.1.0"
edition = "2024"

[dependencies]
# Async runtime
tokio = { version = "1.36", features = ["full"] }

# Web framework
axum = { version = "0.7", features = ["ws"] }

# Native TLS serving (WSS) via rustls. `no-provider` keeps the crypto provider
# choice ours — we install `ring` (matching the rest of the tree; no OpenSSL,
# no aws-lc-rs C build).
axum-server = { version = "0.7", default-features = false, features = [
    "tls-rustls-no-provider",
] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }

# JSON serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP client for Slack webhooks + Prometheus proxy
reqwest = { version = "0.12", features = ["json"] }

# Database
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "migrate"] }

# Timestamps
chrono = { version = "0.4", features = ["serde"] }

# Async trait support (needed for dyn Repository)
async-trait = "0.1"

# UUID generation for host / token IDs
uuid = { version = "1", features = ["v4"] }

# Password hashing
argon2 = "0.5"

# Cookie extraction / setting for sessions
axum-extra = { version = "0.9", features = ["cookie"] }

# Cookie Max-Age durations (already in the dep tree via `cookie`)
time = "0.3"

# Prometheus metrics
prometheus = "0.13"

# WebSocket / async stream utilities
futures-util = "0.3"

dotenvy = "0.15.7"

tower-http = { version = "0.5", features = ["fs", "cors", "trace"] }

# Shared gateway <-> agent wire types
protocol = { path = "../protocol" }
