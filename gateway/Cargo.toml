[package]
name = "gateway"
version = "0.1.0"
edition = "2024"

[dependencies]
# Async runtime
tokio = { version = "1.36", features = ["full"] }

# Web framework
axum = { version = "0.7", features = ["ws"] }

# JSON serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP client for Slack webhooks + Prometheus proxy
reqwest = { version = "0.12", features = ["json"] }

# Database
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "migrate"] }

# Timestamps
chrono = { version = "0.4", features = ["serde"] }

# Async trait support (needed for dyn Repository)
async-trait = "0.1"

# UUID generation for host / token IDs
uuid = { version = "1", features = ["v4"] }

# Prometheus metrics
prometheus = "0.13"

# WebSocket / async stream utilities
futures-util = "0.3"

dotenvy = "0.15.7"

# Shared gateway <-> agent wire types
protocol = { path = "../protocol" }
