# Pulse on a server, from the published images (no build, no source checkout).
# See docs/deployment/docker.md.
#
#   curl -fsSLO https://raw.githubusercontent.com/beacon-engine/pulse/master/deploy/docker/docker-compose.yml
#   docker compose up -d        # dashboard → http://<server>:9080
#
# Settings come from a .env file next to this one (all optional):
#   PULSE_VERSION=0.1.0                 image tag; default latest
#   PULSE_HTTP_PORT=9080                port the dashboard and API are published on
#   PULSE_AGENT_TOKENS=name:secret,...  push agents allowed to connect
#   SLACK_WEBHOOK_URL=https://hooks.slack.com/...
services:
  agent:
    image: beaconengine/pulse-agent:${PULSE_VERSION:-latest}
    # Marks Pulse's own containers: the agent refuses to stop/replace them.
    labels:
      pulse/role: agent
    volumes:
      # Manages this server's containers.
      - /var/run/docker.sock:/var/run/docker.sock
      # Read-only view of the host, so disk metrics show the real disks.
      - /:/host:ro
    environment:
      HOST_ROOT: /host
    restart: unless-stopped
    # No published port: only the gateway reaches the agent, over the compose
    # network. The agent protocol is unauthenticated, so keep it that way.

  gateway:
    image: beaconengine/pulse-gateway:${PULSE_VERSION:-latest}
    labels:
      pulse/role: gateway
    ports:
      - "${PULSE_HTTP_PORT:-9080}:8080"
    environment:
      AGENT_ADDR: agent:9000
      PULSE_AGENT_TOKENS: ${PULSE_AGENT_TOKENS:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
    volumes:
      # Users, environments, stacks and settings (SQLite).
      - pulse-data:/data
    depends_on:
      - agent
    restart: unless-stopped

volumes:
  pulse-data:
