# Pulse agent — PUSH (dial) mode, in-cluster.
#
# The agent dials OUT to the gateway over WebSocket and serves requests on that
# one session, so the cluster only needs outbound egress to the gateway — no
# inbound ports, no ingress for the agent. Kubernetes credentials come from the
# pod's ServiceAccount (the RBAC below); no kubeconfig needed.
#
# The token Secret is created by hand, not in this file, so re-applying it
# never resets the token:
#   kubectl create namespace pulse
#   kubectl -n pulse create secret generic pulse-agent-token --from-literal=token=<token>
# <token> is the value half of a PULSE_AGENT_TOKENS=<name>:<token> entry on the
# gateway. Then set the REPLACE_ME_* values below and:
#   kubectl apply -f agent-push.yaml
# See README.md in this directory for the full walkthrough.
---
apiVersion: v1
kind: Namespace
metadata:
  name: pulse
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pulse-agent
  namespace: pulse
---
# Exactly the verbs the agent's Kubernetes page uses (internal/agent/kubernetes.go).
# It can't read Secrets or ConfigMaps, exec into pods, or create anything.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pulse-agent
rules:
  # Pods page: list, delete (the controller recreates it) and read logs.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]
  # Read-only views: Nodes, Services and Events tabs.
  - apiGroups: [""]
    resources: ["nodes", "services", "events"]
    verbs: ["get", "list"]
  # Workloads: list, scale (patch spec.replicas) and rolling restart (patch the
  # pod template's restartedAt annotation).
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pulse-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pulse-agent
subjects:
  - kind: ServiceAccount
    name: pulse-agent
    namespace: pulse
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulse-agent
  namespace: pulse
  labels:
    app: pulse-agent
  annotations:
    # Accepted Checkov findings, each with its reason:
    checkov.io/skip1: CKV_K8S_38=The agent reads pods and namespaces through the Kubernetes API, so it needs its ServiceAccount token.
    checkov.io/skip2: CKV_K8S_43=Pin the image by digest when you deploy; the release pipeline publishes latest and sha-<commit> tags.
    checkov.io/skip3: CKV_K8S_14=The release pipeline publishes latest and sha-<commit>; use a sha-<commit> tag in production.
    checkov.io/skip4: CKV_K8S_35=The agent reads its token from PULSE_TOKEN; file-based credentials come with agent enrollment (docs/design/agent-enrollment.md).
    checkov.io/skip5: CKV_K8S_8=Push agents open no port to probe; the uplink reconnects on its own and the gateway marks the agent offline on missed heartbeats.
    checkov.io/skip6: CKV_K8S_9=Push agents serve no traffic, so readiness doesn't apply.
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pulse-agent
  template:
    metadata:
      labels:
        app: pulse-agent
        # Marks the agent's pods as Pulse's own: Pulse won't delete them or
        # roll out their Deployment (that would cut its own data stream).
        pulse/role: agent
    spec:
      serviceAccountName: pulse-agent
      # In a cluster the agent only talks to the Kubernetes API (no Docker
      # socket), so it runs unprivileged: non-root, no capabilities, read-only
      # root filesystem, default seccomp.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          # Replace with your registry image (or load into kind/minikube).
          image: beaconengine/pulse-agent:latest
          imagePullPolicy: Always
          env:
            - name: PULSE_MODE
              value: "dial"
            # Gateway WS endpoint. Use ws:// for a plaintext in-cluster gateway,
            # wss:// when TLS is terminated at/in front of the gateway.
            #   in-cluster plaintext: ws://pulse-gateway.pulse.svc.cluster.local:8080/agent/ws
            #   external TLS:          wss://pulse.example.com/agent/ws
            - name: PULSE_GATEWAY_WS_URL
              value: "wss://REPLACE_ME_GATEWAY_HOST/agent/ws"
            # No identity to configure: the agent uses the cluster's id, so a
            # restart/redeploy keeps the same environment in Pulse. Run one
            # agent per cluster. (PULSE_INSTANCE_ID overrides it if you must.)
            # The environment's name in Pulse (defaults to the pod's hostname,
            # which changes on every restart).
            - name: PULSE_ENV_NAME
              value: "REPLACE_ME_CLUSTER_NAME"
            - name: PULSE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: pulse-agent-token
                  key: token
            # Uncomment ONLY for a self-signed / internal-CA gateway certificate
            # (disables server-cert verification — trusted networks only):
            # - name: PULSE_INSECURE_SKIP_TLS_VERIFY
            #   value: "1"
            # No PULSE_KUBECONFIG* → the in-pod ServiceAccount is used.
          resources:
            requests:
              cpu: "25m"
              memory: "32Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
# Push agents only dial out: refuse all inbound traffic. Egress stays open
# (the gateway and the Kubernetes API server).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pulse-agent
  namespace: pulse
spec:
  podSelector:
    matchLabels:
      app: pulse-agent
  policyTypes: ["Ingress"]
