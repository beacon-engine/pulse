# Demo workloads for trying the Kubernetes page on a local cluster (OrbStack,
# Docker Desktop, kind, minikube). Not for production: no resource tuning,
# no network policies.
#
#   kubectl apply -f deploy/kubernetes/examples/demo-workloads.yaml
#   kubectl delete namespace pulse-demo     # clean up
#
# What each piece shows in Pulse:
#   web      Deployment, 3 replicas      scale +/- and rolling restart
#   api      Deployment, 2 containers    per-container logs (app + log sidecar)
#   cache    StatefulSet, 2 replicas     stable pod names (cache-0, cache-1)
#   node-log DaemonSet                   one pod per node; restart, no scaling
#   flaky    Deployment that crashes     CrashLoopBackOff, restarts, not ready
apiVersion: v1
kind: Namespace
metadata:
  name: pulse-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: pulse-demo
spec:
  replicas: 3
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          resources:
            limits: { cpu: 100m, memory: 64Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: pulse-demo
spec:
  replicas: 2
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              i=0
              while true; do
                i=$((i+1))
                echo "GET /orders/$i 200 $((RANDOM % 90 + 10))ms"
                [ $((i % 7)) -eq 0 ] && echo "WARN slow query on /orders/$i" >&2
                sleep 2
              done
          resources:
            limits: { cpu: 50m, memory: 32Mi }
        - name: log-shipper
          image: busybox:1.36
          command: ["sh", "-c", "while true; do echo \"shipped batch at $(date -u +%T)\"; sleep 10; done"]
          resources:
            limits: { cpu: 20m, memory: 16Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: cache
  namespace: pulse-demo
spec:
  clusterIP: None # headless: gives each StatefulSet pod a stable DNS name
  selector: { app: cache }
  ports:
    - port: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cache
  namespace: pulse-demo
spec:
  serviceName: cache
  replicas: 2
  selector:
    matchLabels: { app: cache }
  template:
    metadata:
      labels: { app: cache }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            limits: { cpu: 100m, memory: 64Mi }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-log
  namespace: pulse-demo
spec:
  selector:
    matchLabels: { app: node-log }
  template:
    metadata:
      labels: { app: node-log }
    spec:
      containers:
        - name: collector
          image: busybox:1.36
          command: ["sh", "-c", "while true; do echo \"node $NODE_NAME ok\"; sleep 15; done"]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef: { fieldPath: spec.nodeName }
          resources:
            limits: { cpu: 20m, memory: 16Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flaky
  namespace: pulse-demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: flaky }
  template:
    metadata:
      labels: { app: flaky }
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "echo 'starting…'; sleep 5; echo 'FATAL: config missing DATABASE_URL' >&2; exit 1"]
          resources:
            limits: { cpu: 20m, memory: 16Mi }
