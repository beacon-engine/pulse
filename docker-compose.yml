services:
  agent:
    build:
      context: .
      target: agent
    image: pulse-agent
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /:/host:ro
      # - ${HOME}/.kube/config:/root/.kube/config:ro
    environment:
      HOST_ROOT: /host
    restart: unless-stopped

  gateway:
    build:
      context: .
      target: gateway
    image: pulse-gateway
    ports:
      - "9080:8080" # Unified port: serves both HTTP API and Web UI
    environment:
      AGENT_ADDR: agent:9000
      HTTP_PORT: "8080"
      STATIC_DIR: /app/dist
      DATABASE_URL: sqlite:///data/pulse.db
    volumes:
      - pulse-data:/data
    depends_on:
      - agent
    restart: unless-stopped

volumes:
  pulse-data:
