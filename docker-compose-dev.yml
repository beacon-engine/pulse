services:
  agent:
    image: rust:1-bookworm
    working_dir: /workspace
    volumes:
      - .:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
      - /:/host:ro
      - cargo-cache:/usr/local/cargo
      - agent-target:/workspace/target-agent
    environment:
      HOST_ROOT: /host
      CARGO_TARGET_DIR: /workspace/target-agent
    command: >
      sh -c "which cargo-watch || (curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash && cargo-binstall -y cargo-watch) && cd /workspace && /usr/local/cargo/bin/cargo-watch --workdir /workspace -w agent -w protocol -x 'run --manifest-path agent/Cargo.toml'"

  gateway:
    image: rust:1-bookworm
    working_dir: /workspace
    volumes:
      - .:/workspace
      - pulse-data:/data
      - cargo-cache:/usr/local/cargo
      - gateway-target:/workspace/target-gateway
    ports:
      - "8090:8080"
    environment:
      AGENT_ADDR: agent:9000
      HTTP_PORT: "8080"
      DATABASE_URL: sqlite:///data/pulse.db
      CARGO_TARGET_DIR: /workspace/target-gateway
    command: >
      sh -c "which cargo-watch || (curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash && cargo-binstall -y cargo-watch) && cd /workspace && /usr/local/cargo/bin/cargo-watch --workdir /workspace -w gateway -w protocol -x 'run --manifest-path gateway/Cargo.toml'"

volumes:
  cargo-cache:
  agent-target:
  gateway-target:
  pulse-data:
