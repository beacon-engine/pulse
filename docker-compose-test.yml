version: '3.8'

services:
  agent:
    image: beaconengine/pulse-agent:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /:/host:ro
    environment:
      HOST_ROOT: /host

  gateway:
    image: beaconengine/pulse-gateway:latest
    restart: unless-stopped
    ports:
      - "9080:8080"
    environment:
      AGENT_ADDR: agent:9000
      DATABASE_URL: sqlite:///data/pulse.db
    volumes:
      - pulse-data:/data
    depends_on:
      - agent

volumes:
  pulse-data:
