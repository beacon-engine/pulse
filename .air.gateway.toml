# air config for the gateway — auto rebuild + restart on save.
# Env comes from the environment (set by `make watch-gateway` locally, or by
# docker-compose.dev.yml in a container), so this file works in both places.
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/gateway ./cmd/gateway"
  bin = "./tmp/gateway"
  include_ext = ["go"]
  # Only rebuild when the gateway or shared protocol changes.
  include_dir = ["cmd/gateway", "internal/gateway", "internal/protocol"]
  exclude_regex = ["_test\\.go"]
  delay = 200
  stop_on_error = true
  kill_delay = "2s"
  send_interrupt = true

[log]
  time = true

[misc]
  clean_on_exit = true
