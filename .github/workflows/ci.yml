name: CI Verification

on:
  pull_request:
    branches:
      - master

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Rust Workspace Checks & Tests ─────────────────────────────────────────
  rust-check:
    name: Rust (Format, Clippy, Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check Code Formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Tests
        run: cargo test --workspace --all-targets --verbose

  # ── 2. Frontend Build Check ──────────────────────────────────────────────────
  frontend-check:
    name: Frontend Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  # ── 3. Docker Build Dry-Run ──────────────────────────────────────────────────
  docker-dry-run:
    name: Verify Docker Builds
    runs-on: ubuntu-latest
    needs: [rust-check, frontend-check]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test Build Agent Image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: agent
          push: false
          tags: pulse-agent:test

      - name: Test Build Gateway Image (with Frontend)
        uses: docker/build-push-action@v5
        with:
          context: .
          target: gateway
          push: false
          tags: pulse-gateway:test
