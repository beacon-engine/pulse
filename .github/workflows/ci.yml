name: CI Verification

on:
  pull_request:
    branches:
      - master

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Go Checks & Tests ─────────────────────────────────────────────────────
  go-check:
    name: Go (Format, Vet, Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: go.sum

      - name: Check Code Formatting
        run: |
          unformatted="$(gofmt -l cmd internal)"
          if [ -n "$unformatted" ]; then
            echo "❌ These files are not gofmt-formatted:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Run Tests
        run: go test ./... -count=1

  # ── 2. Frontend Build Check ──────────────────────────────────────────────────
  frontend-check:
    name: Frontend Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  # ── 3. Docker Build Dry-Run ──────────────────────────────────────────────────
  docker-dry-run:
    name: Verify Docker Builds
    runs-on: ubuntu-latest
    needs: [go-check, frontend-check]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test Build Agent Image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: agent
          push: false
          tags: pulse-agent:test

      - name: Test Build Gateway Image (with Frontend)
        uses: docker/build-push-action@v5
        with:
          context: .
          target: gateway
          push: false
          tags: pulse-gateway:test
