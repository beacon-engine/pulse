name: CI Verification

# PRs into release and hotfix branches (where features land) and into master
# (where a release branch lands).
on:
  pull_request:
    branches:
      - master
      - "release/**"
      - "hotfix/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: jobs only need to read the repo.
permissions:
  contents: read

jobs:
  # ── 0. Release Branch Policy ─────────────────────────────────────────────────
  # Master only takes release/vX.Y.Z and hotfix/vX.Y.Z branches; merging one
  # publishes that version (see release.yml). Feature branches merge into a
  # release branch first.
  release-branch:
    name: Release Branch Policy
    if: github.base_ref == 'master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Branch name, VERSION and package.json agree, and the version is new
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          case "$HEAD_REF" in
            release/v*|hotfix/v*) ;;
            *)
              echo "::error::Only release/vX.Y.Z or hotfix/vX.Y.Z branches merge into master (this is '$HEAD_REF'). Merge it into a release branch instead."
              exit 1 ;;
          esac
          v=$(tr -d '[:space:]' < VERSION)
          if [[ ! "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=VERSION::VERSION must be X.Y.Z, got '$v'"
            exit 1
          fi
          if [ "${HEAD_REF#*/}" != "v$v" ]; then
            echo "::error file=VERSION::Branch '$HEAD_REF' doesn't match VERSION ($v). Set VERSION to ${HEAD_REF#*/v}."
            exit 1
          fi
          for f in frontend/package.json frontend/package-lock.json; do
            pkg=$(node -p "require('./$f').version")
            if [ "$pkg" != "$v" ]; then
              echo "::error file=$f::$f version ($pkg) doesn't match VERSION ($v). Run scripts/set-version.sh $v."
              exit 1
            fi
          done
          if git ls-remote --exit-code --tags origin "refs/tags/v$v" >/dev/null; then
            echo "::error file=VERSION::v$v is already released. Bump VERSION (and the branch name)."
            exit 1
          fi
          echo "Releasing v$v on merge."

  # ── 1. Go Checks & Tests ─────────────────────────────────────────────────────
  go-check:
    name: Go (Format, Vet, Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: go.sum

      - name: Check Code Formatting
        run: |
          unformatted="$(gofmt -l cmd internal)"
          if [ -n "$unformatted" ]; then
            echo "❌ These files are not gofmt-formatted:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Run Tests
        run: go test ./... -count=1

  # ── 2. Frontend Build Check ──────────────────────────────────────────────────
  frontend-check:
    name: Frontend Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  # ── 3. Docker Build Dry-Run ──────────────────────────────────────────────────
  docker-dry-run:
    name: Verify Docker Builds
    runs-on: ubuntu-latest
    needs: [go-check, frontend-check]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test Build Agent Image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: agent
          push: false
          tags: pulse-agent:test

      - name: Test Build Gateway Image (with Frontend)
        uses: docker/build-push-action@v5
        with:
          context: .
          target: gateway
          push: false
          tags: pulse-gateway:test
