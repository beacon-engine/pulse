# air config for the agent — auto rebuild + restart on save.
# Env comes from the environment (set by `make watch-agent` locally, or by
# docker-compose.dev.yml in a container), so this file works in both places.
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/agent ./cmd/agent"
  bin = "./tmp/agent"
  include_ext = ["go"]
  # Only rebuild when the agent or shared protocol changes.
  include_dir = ["cmd/agent", "internal/agent", "internal/protocol"]
  exclude_regex = ["_test\\.go"]
  delay = 200
  stop_on_error = true
  kill_delay = "2s"
  send_interrupt = true

[log]
  time = true

[misc]
  clean_on_exit = true
