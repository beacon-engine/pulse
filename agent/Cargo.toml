[package]
name = "pulse-core"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "agent"
path = "src/main.rs"

[dependencies]
# Async runtime (net + process + io needed for the TCP server and docker compose)
tokio = { version = "1.36", features = ["full"] }

# JSON serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Docker API client
bollard = "0.19"

# WebSocket / async stream utilities
futures-util = "0.3"

# Kubernetes client
kube = { version = "0.97", features = ["runtime", "client"] }
k8s-openapi = { version = "0.23", features = ["v1_31"] }

# Timestamps (k8s rollout annotation)
chrono = { version = "0.4", features = ["serde"] }

# System hardware metrics
sysinfo = "0.32"
# statvfs() for reading host disk usage through a bind-mount (containerized runs)
libc = "0.2"
dotenvy = "0.15.7"

# Shared gateway <-> agent wire types
protocol = { path = "../protocol" }
