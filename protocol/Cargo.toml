[package]
name = "protocol"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.36", features = ["io-util", "net"] }

# WebSocket transport (WSS/L7). rustls only — no native-tls/OpenSSL, so slim and
# musl container images link without a system libssl. `default-features = false`
# keeps native-tls out; rustls pins to the `ring` crypto provider already in the
# tree (no aws-lc-rs C build).
tokio-tungstenite = { version = "0.24", default-features = false, features = [
    "connect",
    "handshake",
    "rustls-tls-webpki-roots",
] }
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
    "logging",
] }
webpki-roots = "0.26"
